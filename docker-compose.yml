services:
  ts_connect:
    build: .
    image: ts_connect:latest
    container_name: ts_connect
    volumes:
      - ./log:/usr/server/log
    env_file:
      - .env
    restart: unless-stopped
    networks:
      ptfin-backend:
        aliases:
          - ts_connect.ptfin.local
      ptfin-swarm:
        aliases:
          - ts_connect.ptfin-swarm.local

networks:
  ptfin-backend:
    external: true
    name: ptfin-backend

  ptfin-swarm:
    external: true
    name: ptfin-swarm